[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/auth",
  "crates/oauth",
  "crates/account",
  "crates/silicons",
  "crates/apps",
  "crates/proofs",
  "crates/worker",
  "crates/server",
  "crates/client",
  "crates/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.4.0"
license = "MIT"
repository = "https://github.com/teamofsilicons/silicon-accounts"
authors = ["Team of Silicons"]

[workspace.dependencies]
# internal
silicon-accounts-core = { path = "crates/core" }
silicon-accounts-auth = { path = "crates/auth" }
silicon-accounts-oauth = { path = "crates/oauth" }
silicon-accounts-account = { path = "crates/account" }
silicon-accounts-silicons = { path = "crates/silicons" }
silicon-accounts-apps = { path = "crates/apps" }
silicon-accounts-proofs = { path = "crates/proofs" }
silicon-accounts-worker = { path = "crates/worker" }
silicon-accounts-client = { path = "crates/client", version = "0.4.0" }
# external (keep alphabetical)
aes-gcm = "0.10.3"
anyhow = "1.0.100"
argon2 = { version = "0.5.3", features = ["std"] }
assert_cmd = "2.2.2"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2", "json", "matched-path", "macros", "query", "form"] }
base64 = "0.22.1"
bytes = "1.11.0"
chrono = { version = "0.4.45", default-features = false }
chrono-tz = "0.10.4"
clap = { version = "4.5.48", features = ["derive", "env", "wrap_help"] }
cookie = "0.18.2"
csv = "1.3.1"
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem", "rand_core"] }
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
mime = "0.3.17"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
percent-encoding = "2.3.2"
phonenumber = "0.3.7"
predicates = "3.1.4"
rand = "0.9.2"
regex = "1.11.1"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "form", "json", "rustls", "stream"] }
rpassword = "7.5.4"
rsa = { version = "0.9.10", features = ["getrandom"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
space-station = "0.3.0"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-native-roots", "uuid"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde", "serde-human-readable"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util", "process"] }
tower = { version = "0.5.2", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "limit", "sensitive-headers", "set-header", "fs", "trace", "request-id", "timeout", "compression-gzip"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v7", "v4"] }
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
