onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Production standalone bundles run on Linux ARM64, including native image dependencies.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, arm64]
  libc: [current, glibc]

# GHSA-mrhx-c7xc-m3w5: zod before 4.6.6 can exhaust memory on oversized constrained collections. The AWS credentials
# provider's config reader pins 4.1.x; the fixed release is the same major.
overrides:
  "@vercel/cli-config>zod": "4.6.6"
