<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Silicon Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Silicon Accounts prototypes: one shared shell (top bar with search, app switcher, avatar menu; section list; white page),
   four design languages inside it. Briefcase language: warm canvas, white surfaces, dark primary, mono ids,
   iris gradients for Silicons, orange only for what needs you. */
:root{
  --canvas:#F2F1EE; --surface:#FFFFFF; --surface-2:#F7F6F3; --hover:#F1F0EC; --press:#EAE8E3;
  --line:#ECEAE6; --line-2:#DFDDD7;
  --ink:#1B1B19; --ink-2:#44433E; --muted:#74726B; --faint:#A3A099;
  --accent:#3460F0; --accent-soft:#EEF2FE;
  --si:#7457F2; --si-soft:#F3F0FF; --si-line:#E2DBFF; --si-ink:#5A3FD6;
  --need:#B85B0E; --need-soft:#FFF5EA; --need-line:#F5DFC6;
  --good:#1D9461; --good-soft:#EAF6EF;
  --danger:#CF3F2E; --danger-soft:#FDEEEC; --danger-line:#F3CFCA;
  --dark:#1B1B19; --dark-ink:#FFFFFF;
  --av-l:88%; --av-t:30%;
  --scrim:rgba(24,22,18,.32);
  --shadow-1:0 1px 2px rgba(24,22,18,.04);
  --shadow-pop:0 18px 40px -12px rgba(24,22,18,.22),0 3px 10px rgba(24,22,18,.06);
  --font:"BDO Grotesk","Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-s:8px; --r:10px; --r-l:14px; --r-xl:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#0F0F0E; --surface:#191917; --surface-2:#1F1F1D; --hover:#242422; --press:#2C2C29;
  --line:#2A2927; --line-2:#383733;
  --ink:#F1F0EC; --ink-2:#D0CEC7; --muted:#9A978F; --faint:#6D6B65;
  --accent:#7D9BFF; --accent-soft:#1D2440;
  --si:#A48FFF; --si-soft:#221D38; --si-line:#3A3160; --si-ink:#C7BAFF;
  --need:#F0A35E; --need-soft:#2B2016; --need-line:#4A3520;
  --good:#53C98F; --good-soft:#15281E;
  --danger:#FF7B6A; --danger-soft:#321A17; --danger-line:#5A2A24;
  --dark:#F1F0EC; --dark-ink:#141413;
  --av-l:28%; --av-t:84%;
  --scrim:rgba(0,0,0,.55);
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-pop:0 18px 44px -10px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0F0F0E; --surface:#191917; --surface-2:#1F1F1D; --hover:#242422; --press:#2C2C29;
  --line:#2A2927; --line-2:#383733;
  --ink:#F1F0EC; --ink-2:#D0CEC7; --muted:#9A978F; --faint:#6D6B65;
  --accent:#7D9BFF; --accent-soft:#1D2440;
  --si:#A48FFF; --si-soft:#221D38; --si-line:#3A3160; --si-ink:#C7BAFF;
  --need:#F0A35E; --need-soft:#2B2016; --need-line:#4A3520;
  --good:#53C98F; --good-soft:#15281E;
  --danger:#FF7B6A; --danger-soft:#321A17; --danger-line:#5A2A24;
  --dark:#F1F0EC; --dark-ink:#141413;
  --av-l:28%; --av-t:84%;
  --scrim:rgba(0,0,0,.55);
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-pop:0 18px 44px -10px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.4);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ic.s{width:16px;height:16px}.ic.xs{width:14px;height:14px}.ic.l{width:22px;height:22px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.mono{font-family:var(--mono);font-size:12.5px}
.link{color:var(--accent);font-weight:500}.link:hover{text-decoration:underline}
.b5{font-weight:500}
.mark{display:inline-flex;gap:2px;align-items:center}
.mark i{display:block;width:11px;height:11px;background:var(--ink);border-radius:2px}
.mark i+i{border-radius:50%}
.wbody{height:100%;overflow:auto;position:relative;container-type:inline-size;container-name:win}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r);font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);white-space:nowrap;box-shadow:var(--shadow-1)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.btn.pri:hover{opacity:.88;background:var(--dark)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--danger);border-color:var(--danger-line)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:var(--r-s)}
.btn.lg{height:44px;padding:0 18px;font-size:15px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover,.iconbtn.on{background:var(--hover);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:20px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.need{background:var(--need-soft);color:var(--need)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.iris{background:var(--si-soft);color:var(--si-ink)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill .ic{width:12px;height:12px}
.field{width:100%;height:42px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 12px;background:var(--surface);outline:none;font-size:15px}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fwrap{display:flex;align-items:center;gap:2px;height:42px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 6px 0 12px;background:var(--surface)}
.fwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fwrap input{border:0;outline:none;background:none;flex:1;min-width:0;height:100%;font-family:var(--mono);font-size:14px}
.fwrap .pre{font-family:var(--mono);font-size:14px;color:var(--faint)}
.lab{font-size:13px;font-weight:500;color:var(--ink-2)}
.help{font-size:13px;color:var(--muted);line-height:1.45}
.fgroup{display:flex;flex-direction:column;gap:6px}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;line-height:1.4}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--dark);flex-shrink:0}
.radio{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.radio:has(input:checked){border-color:var(--ink)}
.radio input{accent-color:var(--dark);width:16px;height:16px;margin:0}
.sw{position:relative;width:36px;height:22px;flex-shrink:0;display:inline-block}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:20px;background:var(--line-2);transition:background .15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw input:checked+span{background:var(--dark)}
.sw input:checked+span::after{transform:translateX(14px);background:var(--dark-ink)}
.sw input:disabled+span{opacity:.5}
.sw input:disabled{cursor:not-allowed}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* avatars */
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;background:hsl(var(--h,24) 70% var(--av-l));color:hsl(var(--h,24) 42% var(--av-t));flex-shrink:0;line-height:1}
.si{width:24px;height:24px;border-radius:30%;display:inline-grid;place-items:center;background:linear-gradient(140deg,var(--g1),var(--g2));color:#fff;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.si .ic{width:58%;height:58%}
.si.pending{filter:grayscale(.6);opacity:.72}
.am{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;background:var(--dark);color:var(--dark-ink);flex-shrink:0}
.am .ic{width:60%;height:60%}
.z-sm{width:20px;height:20px;font-size:10px}.z-md{width:32px;height:32px;font-size:13px}.z-lg{width:40px;height:40px;font-size:15px}.z-xl{width:56px;height:56px;font-size:21px}.z-xxl{width:88px;height:88px;font-size:32px}
.am.z-sm{border-radius:6px}.am.z-lg,.am.z-xl{border-radius:11px}.am.z-xxl{border-radius:20px}
.stack{display:inline-flex}.stack>*{box-shadow:0 0 0 2px var(--surface)}.stack>*+*{margin-left:-6px}
.ring{padding:4px;border-radius:50%;background:conic-gradient(from 200deg,#8C7BFF,#4FD1C5,#FFC86B,#FF8F7A,#C17CFF,#8C7BFF);display:inline-grid}
.ring>span{box-shadow:0 0 0 3px var(--surface)}

/* toasts / modal / menus */
.toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--dark);color:var(--dark-ink);border-radius:var(--r-l);padding:10px 10px 10px 16px;font-size:13.5px;box-shadow:var(--shadow-pop);line-height:1.45;animation:up .22s cubic-bezier(.16,1,.3,1)}
.toast button{flex-shrink:0;font-weight:500;padding:5px 10px;border-radius:var(--r-s);background:rgba(127,127,127,.24)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-pop);width:480px;max-width:100%;max-height:calc(100% - 16px);overflow:auto;padding:22px 24px 20px;display:flex;flex-direction:column;gap:14px;animation:up .2s cubic-bezier(.16,1,.3,1)}
.dlg h3{font-size:18px;font-weight:500;letter-spacing:-.01em;line-height:1.3}
.dlg p{line-height:1.5;color:var(--ink-2)}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.dlg .warn{background:var(--need-soft);color:var(--need);border-radius:var(--r);padding:10px 12px;font-size:13px;line-height:1.45;display:flex;gap:8px}
.dlg ul{margin:0;padding-left:18px;color:var(--ink-2);line-height:1.6}
.menu{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:6px;width:300px;max-width:calc(100vw - 24px);box-shadow:var(--shadow-pop);animation:up .16s ease}
.menu .who{display:flex;flex-direction:column;gap:6px;align-items:center;padding:16px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:4px;text-align:center}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:var(--r-s);font-size:14px;color:var(--ink-2)}
.menu .mi:hover,.menu .mi.sel{background:var(--hover);color:var(--ink)}
.menu .mi .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .lbl{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding:8px 10px 6px}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.ag{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:var(--r);font-size:13px;color:var(--ink-2);position:relative}
.ag:hover{background:var(--hover);color:var(--ink)}
.ag .dot{position:absolute;top:10px;right:22px;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--surface)}

/* prototype states (small, bottom right) */
.protobtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;height:32px;padding:0 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.protobtn:hover{color:var(--ink)}
.proto{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:70;width:310px;max-width:calc(100vw - 28px);max-height:calc(100% - 80px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-pop);padding:12px;display:flex;flex-direction:column;gap:10px;animation:up .18s ease}
.proto .lbl{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px}
.proto .opt{display:flex;align-items:center;gap:10px;min-height:34px;padding:6px 8px;border-radius:var(--r-s);font-size:13.5px;color:var(--ink-2);width:100%;line-height:1.3}
.proto .opt:hover{background:var(--hover);color:var(--ink)}
.proto .opt.on{background:var(--surface-2);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.proto .sec{display:flex;flex-direction:column;gap:2px}
.proto .sec+.sec{border-top:1px solid var(--line);padding-top:10px}
.proto .about{font-size:13px;color:var(--ink-2);line-height:1.5;padding:2px 8px}

/* shell */
.acc{min-height:100%;display:flex;flex-direction:column}
.atop{display:flex;align-items:center;gap:6px;height:64px;padding:0 14px 0 20px;position:relative;flex-shrink:0}
.atop .brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:16px;min-width:220px;letter-spacing:-.01em}
.atop .brand .name b{font-weight:500;color:var(--muted)}
.asearch{flex:1;min-width:0;max-width:560px;margin:0 auto;position:relative}
.asearch .box{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);color:var(--faint)}
.asearch .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.asearch input{border:0;outline:none;background:none;flex:1;min-width:0;width:100%;height:100%;color:var(--ink)}
.asearch .results{position:absolute;left:0;right:0;top:46px;width:auto}
.atop .tools{display:flex;align-items:center;gap:2px;margin-left:12px}
.atop .me{border-radius:50%;display:grid;padding:3px;margin-left:4px}
.atop .me:hover{background:var(--hover)}
.abody{flex:1;display:flex;gap:4px;padding:0 12px 12px 8px;min-height:0}
.anav{width:244px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;padding:4px 4px 0;position:sticky;top:0;align-self:flex-start;min-height:calc(100vh - 76px)}
.anav .nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:var(--r);color:var(--ink-2);font-size:14px;width:100%}
.anav .nav:hover{background:var(--hover);color:var(--ink)}
.anav .nav.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
.anav .nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:12px;font-weight:600;background:var(--need-soft);color:var(--need);display:grid;place-items:center}
.anav .nav .cnt.si{background:var(--si-soft);color:var(--si-ink)}
.anav .navlbl{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding:14px 12px 6px}
.anav .foot{margin-top:auto;padding:16px 12px 6px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.anav .foot button{color:var(--muted);text-align:left}.anav .foot button:hover{color:var(--ink)}
.amain{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-1);padding:32px 40px 56px}
.page{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.page.wide{max-width:780px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.ph .sub{color:var(--muted);margin-top:6px;font-size:14.5px;line-height:1.5;max-width:60ch}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:-12px}
.crumb button:hover{color:var(--ink);text-decoration:underline}
.scard{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--surface)}
.scard .hd{padding:18px 20px 12px;display:flex;align-items:flex-start;gap:12px}
.scard .hd h2{font-size:16px;font-weight:500;letter-spacing:-.01em}
.scard .hd p{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.45;max-width:58ch}
.srow{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:56px}
button.srow:hover{background:var(--surface-2)}
.scard>.srow:first-child{border-top:0}
.srow .k{width:150px;flex-shrink:0;font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.01em}
.srow .v{flex:1;min-width:0;line-height:1.4}
.srow .v .d{color:var(--muted);font-size:13px;margin-top:2px}
.srow .chev{color:var(--faint)}
.srow .lead{flex-shrink:0;display:flex}
.acts{display:flex;gap:8px;flex-shrink:0;align-items:center;flex-wrap:wrap}
.srow.foot{justify-content:flex-start;gap:18px;min-height:48px;padding:12px 20px;flex-wrap:wrap}
.srow.compact{padding:10px 18px;min-height:48px}
.handle{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:7px;padding:3px 6px 3px 9px}
.handle button{color:var(--faint);display:grid;place-items:center;width:20px;height:20px;border-radius:5px}
.handle button:hover{color:var(--ink);background:var(--hover)}
.tile{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.tile.need{background:var(--need-soft);color:var(--need)}
.tile.good{background:var(--good-soft);color:var(--good)}
.tile.si{background:var(--si-soft);color:var(--si-ink)}
.tile.bad{background:var(--danger-soft);color:var(--danger)}
.tile.lg{width:40px;height:40px;border-radius:11px}
.attn{border:1px solid var(--need-line);background:var(--need-soft);border-radius:var(--r-l);padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.attn .t{font-weight:500}.attn .d{color:var(--muted);font-size:13px;margin-top:2px}

/* V1 · Needs you first */
.needs{border:1px solid var(--need-line);border-radius:var(--r-l);overflow:hidden;background:var(--surface)}
.needs .hd{padding:16px 20px 12px;display:flex;align-items:center;gap:12px}

.cntb{min-width:22px;height:22px;border-radius:11px;background:var(--need);color:#fff;font-size:12px;font-weight:600;display:inline-grid;place-items:center;padding:0 7px}
.allclear{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r-l);background:var(--good-soft);color:var(--good);font-weight:500;font-size:13.5px;flex-wrap:wrap}
.allclear span{color:var(--ink-2);font-weight:400}
.stat{font-size:13px;color:var(--muted);white-space:nowrap}

/* V2 · Live cards */
.lcgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.lc{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.lc.wide{grid-column:1/-1}
.lc.tint{background:linear-gradient(160deg,var(--si-soft),var(--surface) 70%)}
.lc.warn{border-color:var(--need-line)}
.lc.dangerc{border-color:var(--danger-line)}
.lc .top{display:flex;gap:12px;align-items:center;padding:16px 18px 0}
.lc .top h2{font-size:15.5px;font-weight:500;letter-spacing:-.01em}
.lc .state{font-size:13px;font-weight:500;margin-top:1px}
.lc .state.good{color:var(--good)}.lc .state.need{color:var(--need)}.lc .state.iris{color:var(--si-ink)}.lc .state.muted{color:var(--muted)}.lc .state.bad{color:var(--danger)}
.lc .bd{padding:12px 18px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.lc .ft{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 12px 10px 18px;min-height:52px}
.lc .ft .lk{margin-left:auto;color:var(--accent);font-weight:500;font-size:14px;padding:6px}
.lc .ft .lk:hover{text-decoration:underline}
.lc .mini{display:flex;align-items:center;gap:10px;min-height:28px}
.lc .mini+.mini{border-top:1px solid var(--line);padding-top:8px}
.lc .rows .srow{padding:12px 18px;min-height:52px}
.lc .rows .srow .k{width:110px}
.lc.new{border-style:dashed;border-color:var(--line-2)}
.seg{display:flex;gap:4px}
.seg i{flex:1;height:6px;border-radius:3px;background:var(--line-2)}
.seg i.on{background:var(--good)}
.slip{display:flex;gap:10px;align-items:center;background:var(--si-soft);border-radius:var(--r);padding:10px}

/* V3 · Identity banner */
.banner{border:1px solid var(--si-line);border-radius:var(--r-l);background:linear-gradient(160deg,var(--si-soft),var(--surface) 72%);padding:20px;display:flex;flex-direction:column;gap:16px}
.banner.plain{border-color:var(--line);background:linear-gradient(160deg,var(--surface-2),var(--surface) 72%)}
.banner.warmb{border-color:var(--need-line);background:linear-gradient(160deg,var(--need-soft),var(--surface) 72%)}
.banner .bt{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.banner .eb{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.banner h1{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.2;margin:4px 0 6px}
.banner .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.shortcuts{display:flex;gap:8px;flex-wrap:wrap}
.sc{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;box-shadow:var(--shadow-1);color:var(--ink)}
.sc:hover{background:var(--hover)}
.sc .ic{width:16px;height:16px;color:var(--ink-2)}
.sc.need{color:var(--need);border-color:var(--need-line)}.sc.need .ic{color:var(--need)}
.sc.danger{color:var(--danger);border-color:var(--danger-line)}.sc.danger .ic{color:var(--danger)}

/* V4 · Silicons first */
.sigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sigrid.two{grid-template-columns:repeat(2,1fr)}
.sigrid.four{grid-template-columns:repeat(4,1fr)}
.sigrid.four .sic{gap:12px}
.sic{border:1px solid var(--line);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);text-align:left;min-width:0}
button.sic:hover{background:var(--surface-2)}
.sic.new{border-style:dashed;border-color:var(--line-2);align-items:center;justify-content:center;text-align:center;gap:6px}
.sic.wait{border-color:var(--need-line);background:var(--need-soft)}
.sic .nm{font-size:14.5px;font-weight:500}
.sic.big{padding:16px 16px 14px;gap:12px}
.bars{display:flex;gap:3px;align-items:flex-end;height:30px}
.row>.bars{flex:1;min-width:0}
.sic>.pill{align-self:flex-start}
.bars i{flex:1;border-radius:2px;background:var(--si-line);min-height:3px;display:block}
.bars i.hi{background:var(--si)}
.bars i.zero{background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.sihead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sihead h1{font-size:26px;font-weight:500;letter-spacing:-.02em}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.statgrid>div{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.statgrid>div+div{border-left:1px solid var(--line)}
.statgrid .n{font-size:20px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

@container win (max-width:820px){
  .abody{flex-direction:column;padding:0 8px 8px}
  .anav{width:auto;max-width:100%;align-self:stretch;flex-direction:row;overflow-x:auto;padding:0 4px 8px;gap:4px;position:static;min-height:0}
  .anav .nav{width:auto;white-space:nowrap;height:36px}

  .atop .brand{min-width:0}.atop .brand .name{display:none}

  .amain{padding:22px 16px 32px}
  .cards,.twocol,.intro .three,.lcgrid,.sigrid,.sigrid.two,.two,.statgrid{grid-template-columns:1fr}
  .sigrid.four{grid-template-columns:1fr 1fr}
  .statgrid>div+div{border-left:0;border-top:1px solid var(--line)}
  .srow{flex-wrap:wrap}.scard>.srow:first-child{border-top:0}
.srow .k{width:100%}
  .srow .acts{width:100%;justify-content:flex-end}
}

/* hosted sign-in */
.auth{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:18px}
.authcard{width:420px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-1);padding:32px 32px 28px;display:flex;flex-direction:column;gap:18px}
.authcard .apphead{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.authcard h1{font-size:22px;font-weight:500;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.authcard .sub{color:var(--muted);margin-top:4px;line-height:1.5}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.provider{height:44px;border-radius:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow-1)}
.provider:hover{background:var(--hover)}
.glyph{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.secured{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;text-align:center}
.codeboxes{display:flex;gap:8px}
.codeboxes span{flex:1;height:52px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:22px;background:var(--surface)}
.codeboxes span.f{border-color:var(--ink)}

@media (max-width:560px){.authcard{padding:24px 20px}.keybox code{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================== HIGH FIDELITY LAYER ============================== */
/* motion + interaction states: every control has hover, pressed, focus and disabled */
.btn,.iconbtn,.srow,.sic,.nav,.chips button,.provider,.mi,.ag,.tabs button,.link,.handle button,.acct,.swatches button{transition:background-color .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease,transform .12s ease,opacity .12s ease}
.btn:active:not([disabled]){transform:translateY(.5px);background:var(--press)}
.btn.pri:active:not([disabled]){background:var(--dark);opacity:.8}
.btn.dangerfill:hover{filter:brightness(.94)}
.btn.dangerfill:active:not([disabled]){filter:brightness(.88)}
.btn.dangerfill[disabled]{opacity:.38}
.iconbtn:active,.atop .me:active{background:var(--press)}
button.srow:active,button.sic:active{background:var(--press)}
.anav .nav:active{background:var(--press)}
.chips button:hover{border-color:var(--ink-2);color:var(--ink)}
.chips button.on:hover{color:var(--dark-ink)}

.srow:focus-visible,.sic:focus-visible,.anav .nav:focus-visible,.mi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r)}
.field::placeholder,.fwrap input::placeholder,.asearch input::placeholder{color:var(--faint)}

.field.bad:focus{box-shadow:0 0 0 3px var(--danger-soft)}
.err{display:flex;align-items:flex-start;gap:6px;color:var(--danger);font-size:13px;line-height:1.45}

/* small pieces */
.gl{font-weight:700;font-size:13px;line-height:1}

.cfg{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cfghd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* one-time code: a single real input painted as six boxes */
.codewrap{position:relative}

/* network: offline banner + loading skeleton */
.netbar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:var(--r-l);background:var(--need-soft);border:1px solid var(--need-line);color:var(--ink-2);font-size:13.5px;line-height:1.45}

.skel{display:flex;flex-direction:column;gap:18px}

.skel .sk3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.skip{position:fixed;left:12px;top:-60px;z-index:90;background:var(--dark);color:var(--dark-ink);padding:8px 14px;border-radius:var(--r);font-weight:500;text-decoration:none}
.skip:focus{top:12px}

const TODAY = new Date(2026, 9, 20);
const MON = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function evTime(a){
  let d = new Date(TODAY);
  if (a.day === 'Yesterday') d.setDate(d.getDate() - 1);
  else if (a.day !== 'Today'){ const [dd, mm] = a.day.split(' '); d = new Date(2026, MON[mm], +dd); }
  const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(a.t || ''); let mins = 0;
  if (m){ let h = +m[1] % 12; if (/pm/i.test(m[3])) h += 12; mins = h * 60 + +m[2]; }
  return d.getTime() + mins * 60000 + (a.seq || 0);
}
function actorAv(a){
  if (a.actor && a.actor.startsWith('pending:')) return siAv(SIG[a.actor.slice(8)] ? a.actor.slice(8) : 'other', 'md', true);
  if (a.app) return appAv(a.app, 'md');
  if (a.who && S.silicons[a.who] && !/^You\b/.test(a.text)) return siAv(S.silicons[a.who].sig, 'md');
  if (a.who === 'me' || /^You\b/.test(a.text) || /^(Account|Name|Id|Photo|Date|Timezone|Primary|Added|Removed|Signed out|Unlinked|Connected)\b/.test(a.text)) return av('md');
  return tile(a.icon);
}
const fmtDob = d => { if (!d) return ''; const [y,m,dd] = d.split('-'); return new Date(+y, +m-1, +dd).toLocaleDateString([], {day:'numeric', month:'long', year:'numeric'}); };
function activityFeed(list){
  list = [...list].sort((a, b) => evTime(b) - evTime(a));
  const days = [...new Set(list.map(a => a.day))];
  return days.map(d => `<div class="day">${esc(d)}</div>${list.filter(a=>a.day===d).map(a => `<div class="ev">${actorAv(a)}<div class="grow"><div class="b5">${esc(a.text)}</div>${a.d?`<div class="small muted">${esc(a.d)}</div>`:''}</div><time class="tm">${esc(a.t)}</time></div>`).join('')}`).join('') || '<div class="srow" style="border-top:0"><span class="muted">Nothing here yet.</span></div>';
}

function idCheck(v, cur, prefix){
  v = (v || '').toLowerCase();
  if (v === cur) return {ok:false, kind:'same'};
  if (!/^[a-z0-9_-]{3,30}$/.test(v)) return {ok:false, kind:'invalid'};
  if (['admin','root','support','silicons','help','accounts'].includes(v)) return {ok:false, kind:'reserved'};
  if (['maya','anika','noah','ravi','priya','analyst','scout','growth','research'].includes(v)) return {ok:false, kind:'taken'};
  return {ok:true, kind:'ok'};
}
const idBadge = s => s.ok ? pill('Available','good') : s.kind === 'taken' ? pill('Taken','need') : s.kind === 'reserved' ? pill('Reserved','need') : '';
const idHelp = (s, old) => s.ok ? `Apps are told and keep working. <span class="mono">${esc(old)}</span> stays yours for 10 days in case you change your mind.` : s.kind === 'invalid' ? '3 to 30 characters: a–z, 0–9, hyphen and underscore.' : s.kind === 'taken' ? 'Someone already uses this id. Try another.' : s.kind === 'reserved' ? 'This id is kept for Team of Silicons. Try another.' : 'Type a new id.';
function renderModal(){

}
function setOk(on){ const b = document.getElementById('dlg-ok'); if (b) b.disabled = !on; }
const keyModal = (k, key, rotated) => ({title: rotated ? `New secret key for ${esc(S.silicons[k].name)}` : `${esc(S.silicons[k].name)} is ready`, draft:{},
  body:() => `<p>Copy its secret key now. You won’t be able to see it again.</p>

function listModal(kind){ /* emails or phones */
  const isE = kind === 'emails', arr = isE ? S.me.emails : S.me.phones, key = isE ? 'a' : 'n', noun = isE ? 'email' : 'phone number';

function afterProof(){ if (S.hasAccount){ S.signedIn = true; go('home'); toast(`Signed in as ${esc(S.me.name)}.`); return; } go('welcome'); }

/* ============================== RENDER ============================== */
const AUTH_ROUTES = ['signin','google','code','welcome','gone'];
function render(){
  SCREENS = Object.assign({}, CORE_SCREENS, VARIANT.screens);
  if (!S.signedIn && !AUTH_ROUTES.includes(S.route)) S.route = 'signin';
  const fn = SCREENS[S.route] || SCREENS.home;
  document.getElementById('wbody').innerHTML = fn() + renderModal() + `<div class="toasts" id="toasts"></div>`;
  renderToasts(); renderProto();
}
function renderToasts(){ const el = document.getElementById('toasts'); if (!el) return; el.innerHTML = S.toasts.map(t => `<div class="toast" role="status">${ic('check','s')}<span>${t.html}</span>${t.action?`<button data-act="${t.action}" data-v="${esc(t.v||'')}">${esc(t.label)}</button>`:''}</div>`).join(''); }
function renderProto(){
  const box = document.getElementById('proto'), btn = document.getElementById('protobtn');
  box.hidden = !S.protoOpen; btn.setAttribute('aria-expanded', S.protoOpen ? 'true' : 'false');
  btn.innerHTML = S.protoOpen ? `${ic('x','xs')}Close` : `${ic('settings','xs')}States`;
  if (!S.protoOpen) return;
  box.innerHTML = `<div class="sec"><div class="lbl">${esc(VARIANT.label)}</div><p class="about">${esc(VARIANT.about)}</p></div>
    <div class="sec"><div class="lbl">Start from</div>${SCENARIOS.map(([k,i,l]) => `<button class="opt ${S.scenario===k?'on':''}" data-act="scenario" data-v="${k}">${ic(i,'s')}${esc(l)}</button>`).join('')}</div>
    <div class="sec"><div class="lbl">Network</div>${[['ok','check','Normal'],['slow','clock','Slow: show loading'],['offline','alert','Offline']].map(([k,i,l]) => `<button class="opt ${S.net===k?'on':''}" data-act="net" data-v="${k}">${ic(i,'s')}${l}</button>`).join('')}</div>
    <div class="sec"><div class="lbl">View</div><button class="opt" data-act="theme">${ic('settings','s')}Switch light / dark</button><button class="opt" data-act="pickFont">${ic('plus','s')}Use your BDO Grotesk file</button></div>`;
}

/* ============================== EVENTS ============================== */
const OFFLINE_OK = new Set(['scenario','proto','theme','pickFont','net','retry','menu','closeModal','filter','who','copy','help','whatSilicon','soon','openApp','dismissIntro']);
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act],[data-go],input,label')) return;
  const el = e.target.closest('[data-go],[data-act]');
  if (!el){ if (S.menu && !e.target.closest('.menu,.asearch,.proto')){ S.menu = null; render(); } return; }
  if (el.disabled) return;
  if (el.dataset.go){ let p; try { p = el.dataset.p ? JSON.parse(el.dataset.p) : undefined; } catch(err){} go(el.dataset.go, p); return; }
  const a = el.dataset.act;
  if (!a) return;
  if (a === 'toggleSaved'){ ACT[a](el.dataset.v, el); return; }
  if (a === 'closeModal' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  if (S.menu && !['menu','proto','theme','pickFont'].includes(a)) S.menu = null;
  if (S.net === 'offline' && !OFFLINE_OK.has(a)){ if (el.type === 'checkbox') el.checked = !el.checked; S.modal = null; render(); toast('You’re offline. Try again when you’re back online.'); return; }
  if (ACT[a]) ACT[a](el.dataset.v, el);
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset) return;
  if (el.dataset.code){ const v = el.value.replace(/\D/g,'').slice(0,6); el.value = v; const st = el.dataset.code === 'auth' ? S.auth : S.draft; st.code = v; st.codeErr = null; if (el.dataset.code !== 'auth') S.draft.filled = false;
    const wrap = el.closest('.codewrap'); wrap.classList.remove('bad'); wrap.querySelectorAll('.codeboxes span').forEach((b,i) => { b.textContent = v[i] || ''; b.className = (v[i]?'f ':'') + (i===v.length?'cur':''); }); const er = document.getElementById('code-err'); if (er) er.remove();
    const okb = document.getElementById(el.dataset.code === 'auth' ? 'code-ok' : 'dlg-ok'); if (okb) okb.disabled = v.length !== 6;
    if (v.length === 6 && el.dataset.code === 'auth') setTimeout(() => ACT.codeContinue(), 120);
    return; }
  if (el.dataset.live === 'search'){ S.q = el.value; S.menu = 'search'; S.sel = 0; const pos = el.selectionStart; render(); const f = document.getElementById('f-search'); f.focus(); f.setSelectionRange(pos, pos); return; }
  if (!el.dataset.draft) return;
  S.draft[el.dataset.draft] = el.value;
  const live = el.dataset.live;
  if (live === 'idcheck'){ const st = idCheck(el.value, el.dataset.cur); document.getElementById('idbadge').innerHTML = idBadge(st); document.getElementById('idhelp').innerHTML = idHelp(st, el.dataset.old); setOk(st.ok); }
  if (live === 'sislug'){ const v = el.value.trim(); document.getElementById('sislug').innerHTML = v ? `Its id will be <span class="mono">si:${esc(slug(v))}</span>` : 'Its id is suggested from the name. You can change it later.'; setOk(!!v); }
  if (live === 'okIfFilled'){ setOk(el.value.trim().length >= 1); }
  if (live === 'handover'){ const r = lookupPerson(el.value); document.getElementById('hv-res').innerHTML = personRes(r); el.classList.toggle('bad', !!r.err); setOk(!!r.ok); }
  if (live === 'confirm'){ setOk(el.value === el.dataset.want); }
  if (live === 'repo'){ setOk(/^[\w.-]+\/[\w.-]+$/.test(el.value.trim())); }
});
document.addEventListener('change', e => { const el = e.target; if ((el.tagName === 'SELECT' || el.type === 'radio' || el.type === 'date') && el.dataset.draft){ S.draft[el.dataset.draft] = el.value; if (el.type === 'date') setOk(!!el.value); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.modal || S.menu)){ if (S.modal && S.modal.noEsc) return; const back = S.modal && S.modal.opener; S.modal = null; S.menu = null; S.q = ''; render(); if (back) document.querySelector(back)?.focus(); return; }
  if (e.target.id === 'f-search' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){ const n = searchHits().length; if (!n) return; e.preventDefault(); S.sel = ((S.sel || 0) + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; const pos = e.target.selectionStart; render(); const f = document.getElementById('f-search'); f.focus(); f.setSelectionRange(pos, pos); return; }
  if (e.key === 'Enter' && e.target.id === 'f-search'){ const cur = document.querySelector('.results .mi.sel[data-go]') || document.querySelector('.results .mi[data-go]'); if (cur){ e.preventDefault(); cur.click(); } return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ const f = document.getElementById('f-search'); if (f){ e.preventDefault(); f.focus(); } return; }
  if (e.key === 'Tab' && S.modal){ const d = document.querySelector('.dlg'); if (!d) return; const f = [...d.querySelectorAll('button:not([disabled]),input:not([disabled]),select,[tabindex]')]; if (!f.length) return; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length-1].focus(); } else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); } return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.draft){
    if (e.target.id === 'f-new'){ e.preventDefault(); const b = document.querySelector('[data-act="sendContactCode"]'); if (b) b.click(); return; }
    const ok = document.getElementById('dlg-ok'); if (ok && !ok.disabled){ e.preventDefault(); ok.click(); return; }
    const m = {authEmail:'sendCode', wname:'welcomeContinue'}[e.target.dataset.draft]; if (m){ e.preventDefault(); ACT[m](); }
  }
});
const fontPicker = document.createElement('input'); fontPicker.type = 'file'; fontPicker.accept = '.woff2,.woff,.otf,.ttf'; fontPicker.hidden = true; document.body.appendChild(fontPicker);
async function useFont(url, quiet){ try { const ff = new FontFace('BDO Grotesk', `url(${url})`, {weight:'100 900'}); await ff.load(); document.fonts.add(ff); if (!quiet) toast('BDO Grotesk is now used everywhere.'); } catch(e){ if (!quiet) toast('That file couldn’t be read as a font. Try .woff2, .otf or .ttf.'); } }
fontPicker.addEventListener('change', () => { const f = fontPicker.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { localStorage.setItem('acc-font', String(r.result)); } catch(e){} useFont(String(r.result)); }; r.readAsDataURL(f); });
try { const saved = localStorage.getItem('acc-font'); if (saved) useFont(saved, true); } catch(e){}

/* ============================== COMBINED · NEEDS FIRST + SILICONS FIRST ==============================
   Home answers two questions in order: what needs me, then how are my Silicons and apps doing.
   Section pages lead with their own needs (only when something is waiting); Silicons stay first-class. */
function needsBlock(scope, title){
  const items = needs(scope);
  return items.length ? `<section class="needs"><div class="hd"><h2 class="grow">${title || 'Needs you'}</h2><span class="cntb">${items.length}</span></div>${items.map(needRow).join('')}</section>` : '';
}
const first = () => esc((S.me.name || '').split(' ')[0]);
const sumBars = s => s.bars.reduce((a,b) => a+b, 0);
const siLine = k => { const s = S.silicons[k]; return s.state === 'handover' ? `Handing over to ${esc(s.to)}` : `Signed in ${esc(s.last)}`; };
function siTile(k){
  const s = S.silicons[k], [l,kind] = siStatus(k);
  return `<button class="sic" data-go="silicon" ${P({k})}><span class="row" style="gap:10px">${siAv(s.sig,'md')}<span class="nm grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</span></span><span class="row" style="gap:8px">${pill(l,kind)}<span class="tiny muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.state==='handover' ? 'to ' + esc((s.toName || s.to).split(' ')[0]) : esc(s.last)}</span></span>${bars(s.bars)}</button>`;
}
function appTile(a){
  const sis = silsInApp(a);
  const who = sis.length ? `You + ${sis.length}` : 'Just you', full = sis.length ? `You and ${plural(sis.length, 'Silicon')}` : 'Just you';
  return `<button class="sic" data-go="app" ${P({a})} aria-label="${APPS[a].name}: ${full}" title="${full}"><span class="row" style="gap:10px">${appAv(a,'md')}<span class="nm grow">${APPS[a].name}</span></span><span class="row" style="gap:8px"><span class="stack">${av('sm')}${sis.map(k => siAv(S.silicons[k].sig,'sm')).join('')}</span><span class="tiny muted">${who}</span></span></button>`;
}
const newSiCard = () => `<button class="sic new" data-act="newSilicon">${tile('plus','','lg')}<span class="nm">New Silicon</span></button>`;
const VARIANT = {
  key:'hifi', label:'Silicon Accounts',
  about:'High-fidelity prototype. Home shows what needs you first, then your Silicons and apps. Use these controls to jump to any starting state or network condition.',
  nav:[['home','home','Home'],['silicons','sparkO','Silicons'],['apps','grid','Connected apps'],['security','shield','Security'],['personal','idcard','Personal info'],['notifications','bell','Notifications'],['data','data','Data & privacy']],
  badge(r){ if (r === 'security') return {n:needs('security').length}; if (r === 'silicons') return {n:needs('silicons').length}; return null; },
  screens:{
    home(){
      const ks = siKeys(), on = appsOn();
      return shell(`
        <div class="greet">${ringAv('lg')}<div class="grow"><h1>Welcome back, ${first()}</h1><div style="margin-top:6px">${handle(myId())}</div></div></div>
        ${needs('all').length ? needsBlock('all') : `<div class="allclear" role="status">${ic('check','s')}You’re all set<span>· nothing needs you right now</span></div>`}
        ${S.intro ? introCard() : ''}
        <div class="sechd"><h2 class="grow">Your Silicons</h2>${ks.length ? `<button class="link" data-go="silicons">See all</button>` : ''}</div>
        <div class="sigrid">${ks.slice(0,2).map(siTile).join('')}${newSiCard()}</div>
        <div class="sechd"><h2 class="grow">Your apps</h2>${on.length ? `<button class="link" data-go="apps">See all</button>` : ''}</div>
        ${on.length ? `<div class="sigrid four">${on.slice(0,4).map(appTile).join('')}</div>` : `<div class="allclear quiet">Apps appear here after you sign in to them.</div>`}`);
    },
    silicons(){
      const ks = siKeys();
      return shell(`${pageHead('Silicons', '', B({l:'New Silicon', act:'newSilicon', icon:'plus', kind:'pri'}, false))}
        ${needsBlock('silicons','Waiting for you')}
        ${ks.length ? `<div class="sigrid two">${ks.map(siTile).join('')}</div>` : emptyState('sparkO','No Silicons yet','Give an AI agent its own account. You look after it.')}`);
    },
    silicon(){
      const k = S.params.k, s = S.silicons[k]; if (!s) return SCREENS.silicons();
      const [l,kind] = siStatus(k), tab = S.params.tab || 'activity', uses = siUses(s);
      const tabs = [['activity','Activity'],['access','Access'],['settings','Settings']];
      let body = '';
      if (tab === 'activity') body = `<section class="scard">${activityFeed(S.activity.filter(a => a.who === k))}</section>`;
      if (tab === 'access') body = scard('Apps it may use', '', R.siApps(k)) + scard('Secret key', '', R.siKey(k)) + scard('Automation', '', R.trusts(k)) + scard('Cloud services', '', R.audiences(k));
      if (tab === 'settings') body = scard('About', '', R.siAbout(k)) + R.siDanger(k);
      return shell(`${crumb('Silicons','silicons')}
        <div class="sihead">${siAv(s.sig,'xl')}<div class="grow"><h1>${esc(s.name)}</h1><div class="row wrap" style="margin-top:6px;gap:8px">${handle('si:'+s.id)}${pill(l,kind)}</div></div></div>
        ${needsBlock('si:'+k)}
        <div class="statgrid"><div><span class="tiny muted">Last sign-in</span><span class="n" style="font-size:17px">${esc(cap1(s.last))}</span></div><div><span class="tiny muted">Apps</span><span class="n" style="font-size:17px">${uses.length}</span></div><div><span class="tiny muted">Sign-ins, 14 days</span><span class="n" style="font-size:17px">${sumBars(s)}</span>${bars(s.bars)}</div></div>
        <div class="tabs" role="tablist">${tabs.map(([t,lb]) => `<button role="tab" aria-selected="${tab===t}" class="${tab===t?'on':''}" data-go="silicon" ${P({k, tab:t})}>${lb}</button>`).join('')}</div>
        ${body}`);
    },
    apps(){
      const on = appsOn();
      return shell(`${pageHead('Connected apps')}
        ${on.length ? scard('', '', on.map(a => { const sis = silsInApp(a); return srow({lead:appAv(a,'lg'), v:APPS[a].name, d: esc(listJoin(['You', ...sis.map(k=>S.silicons[k].name)])), go:'app', p:{a}, right: `<span class="stack">${av('sm')}${sis.map(k => siAv(S.silicons[k].sig,'sm')).join('')}</span>`}); }).join('') + R.permsLink()) : emptyState('grid','No apps yet','Apps appear here after you or your Silicons sign in.')}`);
    },
    app(){
      const a = S.params.a, app = APPS[a], m = S.apps[a]; if (!m || !m.on) return SCREENS.apps();
      const pr = activeProofs(a).filter(p => p.from === a), allowed = siKeys().filter(k => S.silicons[k].allow[a] !== 'off');
      return shell(`${crumb('Connected apps','apps')}
        <div class="ph center"><div class="row" style="gap:16px">${appAv(a,'xl')}<div><h1>${esc(app.name)}</h1><p class="sub" style="margin-top:4px">${esc(app.blurb)} · since ${esc(m.since)}</p></div></div><div class="grow"></div>${B({l:'Open', act:'openApp', v:a, icon:'out'}, false)}</div>
        ${scard('Who uses it', '', srow({lead:av('md'), v:'You', d:`Used ${esc(m.last.toLowerCase())}`}) + allowed.map(k => { const s = S.silicons[k]; return srow({lead:siAv(s.sig,'md'), v:esc(s.name), d: s.allow[a]==='signed' ? 'Signed in' : 'Allowed', go:'silicon', p:{k, tab:'access'}}); }).join(''))}
        ${scard('What it can see about you', '', R.appSees(a))}
        ${pr.length ? scard('Also acts for you', '', pr.map(R.proof).join('')) : ''}
        <section class="dz">${srow({v:`Remove ${esc(app.name)} for you`, d:'Your Silicons keep their access', right:B({l:'Remove', act:'askRemoveApp', v:a, kind:'danger'})})}</section>`);
    },
    acting(){
      const act = activeProofs(), past = pastProofs();
      return shell(`${crumb('Connected apps','apps')}${pageHead('Permissions between apps', actingSub)}
        ${scard('Active', '', act.length ? act.map(R.proof).join('') : srow({v:'<span class="muted">None</span>'}))}
        ${past.length ? scard('Ended', '', past.map(R.proof).join('')) : ''}`);
    },
    security(){
      const ks = siKeys();
      return shell(`${pageHead('Security')}
        ${needsBlock('security','Checkup')}
        ${ks.length ? scard('Silicon keys', '', ks.map(k => { const s = S.silicons[k]; return srow({lead:siAv(s.sig,'md'), v:esc(s.name), d:`Made ${esc(s.keyAge)}`, right:B({l:'Change', act:'askRotate', v:k, kind:S.alerts[k]?'pri':''})}); }).join('')) : ''}
        ${scard('Your sign-in', '', R.signin())}
        ${scard('Devices', '', R.devices())}
        ${scard('', '', srow({lead:tile('history'), v:'Activity', go:'activity'}))}`);
    },
    activity(){ return activityPage({who:true}); },
    personal(){ return shell(`${pageHead('Personal info')}${scard('Profile', '', R.basic())}${scard('Contact', '', R.contact())}`); },
    notifications(){ const n = R.notify();
      return shell(`${pageHead('Notifications')}${scard('Send to', '', n.to)}${siKeys().length ? scard('Your Silicons', '', n.always + n.silicons) : ''}${scard('Alerts', '', (siKeys().length ? '' : n.always) + n.security + n.product)}`);
    },
    data(){
      const on = appsOn();
      return shell(`${pageHead('Data & privacy')}
        ${scard('What apps see', 'Change what each app can see from its page.', on.map(a => srow({lead:appAv(a,'md'), v:APPS[a].name, d:esc(seesShort(a)), go:'app', p:{a}})).join('') || srow({v:'<span class="muted">No app can see anything about you.</span>'}))}
        ${scard('', '', srow({lead:tile('download'), v:'Download your data', d:'Your profile, sign-ins, Silicons and activity as a file', act:'download'}))}
        ${R.accountDanger()}`);
    }
  }
};

const start = (location.hash || '').replace('#','');
ACT.scenario(SCENARIOS.some(s => s[0] === start) ? start : 'today');
</script>
